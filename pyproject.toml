[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "collaborators"
version = "2.0.0"
description = "A Lead, Workers and Testers made of Claude agents, orchestrated live in one beautiful terminal UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["claude", "agents", "tui", "textual", "orchestration"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "textual>=1.0",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
collab = "collaborators.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/collaborators"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
